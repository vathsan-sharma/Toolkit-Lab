<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <title>PDF to JPG: Save Each Page as an Image - Toolkit Lab</title>
  <meta name="description" content="Convert each page of a PDF into a JPG image and download them. Runs in your browser and nothing is uploaded.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../assets/app.js" defer></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">T</span>Toolkit Lab</a>
      <nav class="site">
        <a href="../index.html#tools">Tools</a>
        <a href="../guides/index.html">Guides</a>
        <a href="../about.html">About</a>
        <div class="nav-tools">
          <button class="search-trigger" data-open-palette type="button" aria-label="Open search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>Search</span><kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle theme"></button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail">Ad space</div></aside>
    <div class="wrap">
      <div class="tool-head">
        <p class="crumbs"><a href="../index.html">Tools</a> / PDF to JPG</p>
        <h1>PDF to JPG</h1>
        <p class="lead">Turn each page of a PDF into a JPG image. Download one page at a time.</p>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement">Ad space</div>

      <div class="panel">
        <label for="file">PDF file</label>
        <input type="file" id="file" accept="application/pdf,.pdf">

        <label for="scale">Image size</label>
        <select id="scale">
          <option value="1">Standard (about 72 dpi)</option>
          <option value="2" selected>Sharp (about 144 dpi)</option>
          <option value="3">Very sharp (about 216 dpi, slower)</option>
        </select>

        <div class="row">
          <button id="render" type="button" disabled>Convert pages</button>
        </div>

        <p id="status" class="note" hidden></p>
        <p id="error" class="error" hidden></p>

        <div id="pages" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:20px"></div>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement">Ad space</div>
    </div>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail">Ad space</div></aside>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../contact.html">Contact</a>
      <p>&copy; 2026 Toolkit Lab</p>
    </div>
  </footer>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';

    const fileInput = document.getElementById('file');
    const scaleSelect = document.getElementById('scale');
    const renderBtn = document.getElementById('render');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const pagesEl = document.getElementById('pages');
    let file = null;
    let downloads = [];

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = !message;
    }

    function setStatus(message) {
      statusEl.textContent = message;
      statusEl.hidden = !message;
    }

    function clearPages() {
      downloads.forEach(url => URL.revokeObjectURL(url));
      downloads = [];
      pagesEl.innerHTML = '';
    }

    fileInput.addEventListener('change', () => {
      showError('');
      clearPages();
      file = fileInput.files[0] || null;
      renderBtn.disabled = !file;
    });

    renderBtn.addEventListener('click', async () => {
      if (!file) return;
      showError('');
      clearPages();
      renderBtn.disabled = true;
      try {
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        const scale = Number(scaleSelect.value);
        const base = file.name.replace(/\.pdf$/i, '');

        for (let n = 1; n <= pdf.numPages; n++) {
          setStatus('Converting page ' + n + ' of ' + pdf.numPages + '...');
          const page = await pdf.getPage(n);
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          const ctx = canvas.getContext('2d');
          // White background so transparent areas do not turn black in JPG.
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          await page.render({ canvasContext: ctx, viewport }).promise;

          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
          const url = URL.createObjectURL(blob);
          downloads.push(url);

          const card = document.createElement('a');
          card.href = url;
          card.download = base + '-page-' + n + '.jpg';
          card.className = 'card';
          card.style.padding = '10px';
          card.innerHTML = '<img alt="Page ' + n + '" style="width:100%;border-radius:6px;border:1px solid var(--border)"><p style="margin-top:8px;font-size:0.85rem">Page ' + n + ' (JPG)</p>';
          card.querySelector('img').src = url;
          pagesEl.appendChild(card);
        }
        setStatus('Done. Click a page to download it as a JPG.');
      } catch (err) {
        setStatus('');
        showError('This PDF could not be converted. It may be password-protected or damaged.');
      } finally {
        renderBtn.disabled = !file;
      }
    });
  </script>
</body>
</html>
