<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <title>Password Generator - Toolkit Lab</title>
  <meta name="description" content="Generate strong random passwords in your browser. Choose length and character types. Nothing is sent to a server.">
  <link rel="canonical" href="https://toolkitlab.xyz/tools/password-generator.html">
  <meta property="og:site_name" content="Toolkit Lab">
  <meta property="og:url" content="https://toolkitlab.xyz/tools/password-generator.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../assets/app.js" defer></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">T</span>Toolkit Lab</a>
      <nav class="site">
        <a href="../index.html#tools">Tools</a>
        <a href="../guides/index.html">Guides</a>
        <a href="../about.html">About</a>
        <div class="nav-tools">
          <button class="search-trigger" data-open-palette type="button" aria-label="Open search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>Search</span><kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle theme"></button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail"></div></aside>
    <div class="wrap">
      <h1>Password Generator</h1>
      <p class="lead">Create a random password using your browser's secure random number generator.</p>
      <div class="ad-slot" aria-label="Advertisement"></div>

      <div class="panel">
        <label for="password">Generated password</label>
        <textarea id="password" rows="2" readonly style="min-height:0;font-size:1.1rem"></textarea>

        <label for="length">Length: <span id="lengthValue">16</span></label>
        <input type="range" id="length" min="8" max="64" value="16" style="width:100%">

        <label><input type="checkbox" id="upper" checked> Uppercase letters (A-Z)</label>
        <label><input type="checkbox" id="lower" checked> Lowercase letters (a-z)</label>
        <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
        <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%...)</label>

        <div class="row">
          <button id="generate">Generate new</button>
          <button id="copy" class="secondary">Copy</button>
        </div>

        <p id="strength" class="note"></p>
        <p id="error" class="error" hidden></p>
        <p class="note">Passwords are generated on your device and are never stored or sent anywhere.</p>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement"></div>
    </div>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail"></div></aside>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../contact.html">Contact</a>
      <p>&copy; 2026 Toolkit Lab</p>
    </div>
  </footer>

  <script>
    const sets = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()-_=+[]{};:,.?'
    };

    const lengthInput = document.getElementById('length');
    const lengthValue = document.getElementById('lengthValue');
    const passwordEl = document.getElementById('password');
    const strengthEl = document.getElementById('strength');
    const errorEl = document.getElementById('error');

    function randomInt(max) {
      const limit = Math.floor(0x100000000 / max) * max;
      const buf = new Uint32Array(1);
      do {
        crypto.getRandomValues(buf);
      } while (buf[0] >= limit);
      return buf[0] % max;
    }

    function generate() {
      const active = Object.keys(sets).filter(key => document.getElementById(key).checked);
      if (active.length === 0) {
        errorEl.textContent = 'Select at least one character type.';
        errorEl.hidden = false;
        passwordEl.value = '';
        strengthEl.textContent = '';
        return;
      }
      errorEl.hidden = true;

      const length = Number(lengthInput.value);
      const pool = active.map(key => sets[key]).join('');
      // Guarantee at least one character from each selected set.
      const chars = active.map(key => sets[key][randomInt(sets[key].length)]);
      while (chars.length < length) {
        chars.push(pool[randomInt(pool.length)]);
      }
      for (let i = chars.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [chars[i], chars[j]] = [chars[j], chars[i]];
      }

      passwordEl.value = chars.join('');
      const bits = Math.round(length * Math.log2(pool.length));
      let rating = 'Weak';
      if (bits >= 100) rating = 'Very strong';
      else if (bits >= 75) rating = 'Strong';
      else if (bits >= 50) rating = 'Fair';
      strengthEl.textContent = rating + ' (about ' + bits + ' bits of entropy)';
    }

    lengthInput.addEventListener('input', () => {
      lengthValue.textContent = lengthInput.value;
      generate();
    });
    Object.keys(sets).forEach(key => {
      document.getElementById(key).addEventListener('change', generate);
    });
    document.getElementById('generate').addEventListener('click', generate);

    document.getElementById('copy').addEventListener('click', async () => {
      if (!passwordEl.value) return;
      try {
        await navigator.clipboard.writeText(passwordEl.value);
        strengthEl.textContent = 'Copied to clipboard.';
      } catch (err) {
        passwordEl.select();
        document.execCommand('copy');
        strengthEl.textContent = 'Copied to clipboard.';
      }
    });

    generate();
  </script>
</body>
</html>
