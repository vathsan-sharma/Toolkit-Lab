<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <title>Split PDF: Extract Pages Online - Toolkit Lab</title>
  <meta name="description" content="Pull out selected pages from a PDF into a new file, such as pages 2 to 5 or 1, 3 and 7. Runs in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../assets/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">T</span>Toolkit Lab</a>
      <nav class="site">
        <a href="../index.html#tools">Tools</a>
        <a href="../guides/index.html">Guides</a>
        <a href="../about.html">About</a>
        <div class="nav-tools">
          <button class="search-trigger" data-open-palette type="button" aria-label="Open search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>Search</span><kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle theme"></button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail"></div></aside>
    <div class="wrap">
      <div class="tool-head">
        <p class="crumbs"><a href="../index.html">Tools</a> / Split PDF</p>
        <h1>Split PDF</h1>
        <p class="lead">Choose the pages you need from a PDF and save them as a new file.</p>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement"></div>

      <div class="panel">
        <label for="file">PDF file</label>
        <input type="file" id="file" accept="application/pdf,.pdf">
        <p id="info" class="note" hidden></p>

        <label for="range">Pages to keep</label>
        <input type="text" id="range" placeholder="for example 1-3, 5, 8-10" spellcheck="false">
        <p class="note">Separate ranges with commas. Page numbers start at 1.</p>

        <div class="row">
          <button id="split" type="button" disabled>Extract and download</button>
        </div>

        <p id="error" class="error" hidden></p>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement"></div>
    </div>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail"></div></aside>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../contact.html">Contact</a>
      <p>&copy; 2026 Toolkit Lab</p>
    </div>
  </footer>

  <script>
    const fileInput = document.getElementById('file');
    const rangeInput = document.getElementById('range');
    const splitBtn = document.getElementById('split');
    const errorEl = document.getElementById('error');
    const info = document.getElementById('info');
    let file = null;
    let pageCount = 0;

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = !message;
    }

    // Turns "1-3, 5" into zero-based page indexes, or null if the text is invalid.
    function parseRanges(text, total) {
      const indexes = new Set();
      for (const part of text.split(',').map(p => p.trim()).filter(Boolean)) {
        const m = /^(\d+)(?:\s*-\s*(\d+))?$/.exec(part);
        if (!m) return null;
        const from = parseInt(m[1], 10);
        const to = m[2] ? parseInt(m[2], 10) : from;
        if (from < 1 || to > total || from > to) return null;
        for (let p = from; p <= to; p++) indexes.add(p - 1);
      }
      return indexes.size ? [...indexes].sort((a, b) => a - b) : null;
    }

    fileInput.addEventListener('change', async () => {
      showError('');
      file = fileInput.files[0] || null;
      splitBtn.disabled = true;
      info.hidden = true;
      if (!file) return;
      if (!window.PDFLib) {
        showError('The PDF library could not load. Check your internet connection and try again.');
        return;
      }
      try {
        const doc = await window.PDFLib.PDFDocument.load(await file.arrayBuffer());
        pageCount = doc.getPageCount();
        info.textContent = file.name + ' has ' + pageCount + ' page' + (pageCount === 1 ? '' : 's') + '.';
        info.hidden = false;
        splitBtn.disabled = false;
      } catch (err) {
        showError('This PDF could not be read. It may be password-protected or damaged.');
      }
    });

    splitBtn.addEventListener('click', async () => {
      showError('');
      const indexes = parseRanges(rangeInput.value, pageCount);
      if (!indexes) {
        showError('Enter page numbers between 1 and ' + pageCount + ', for example 1-3, 5.');
        return;
      }
      splitBtn.disabled = true;
      try {
        const { PDFDocument } = window.PDFLib;
        const source = await PDFDocument.load(await file.arrayBuffer());
        const out = await PDFDocument.create();
        const pages = await out.copyPages(source, indexes);
        pages.forEach(page => out.addPage(page));
        const bytes = await out.save();
        const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = file.name.replace(/\.pdf$/i, '') + '-pages.pdf';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (err) {
        showError('Could not create the new PDF. Please try again.');
      } finally {
        splitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
