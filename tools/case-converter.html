<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="google-adsense-account" content="ca-pub-1766259744738866">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <title>Case Converter - Toolkit Lab</title>
  <meta name="description" content="Convert text to UPPERCASE, lowercase, Title Case, camelCase, snake_case and more. Free and private.">
  <link rel="canonical" href="https://toolkitlab.xyz/tools/case-converter.html">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1766259744738866" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">T</span>Toolkit Lab</a>
      <nav class="site">
        <a href="../index.html#tools">Tools</a>
        <a href="../guides/index.html">Guides</a>
        <a href="../about.html">About</a>
        <div class="nav-tools">
          <button class="search-trigger" data-open-palette type="button" aria-label="Open search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>Search</span><kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle theme"></button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail"></div></aside>
    <div class="wrap">
      <h1>Case Converter</h1>
      <p class="lead">Paste your text and pick a case style. Works for writing, titles and code names.</p>
      <div class="ad-slot" aria-label="Advertisement"></div>

      <div class="panel">
        <label for="input">Your text</label>
        <textarea id="input" placeholder="type or paste text here"></textarea>

        <div class="row">
          <button data-case="upper">UPPERCASE</button>
          <button data-case="lower" class="secondary">lowercase</button>
          <button data-case="title" class="secondary">Title Case</button>
          <button data-case="sentence" class="secondary">Sentence case</button>
          <button data-case="camel" class="secondary">camelCase</button>
          <button data-case="pascal" class="secondary">PascalCase</button>
          <button data-case="snake" class="secondary">snake_case</button>
          <button data-case="kebab" class="secondary">kebab-case</button>
        </div>

        <label for="output">Result</label>
        <textarea id="output" readonly></textarea>

        <div class="row">
          <button id="copy" class="secondary">Copy result</button>
          <button id="useResult" class="secondary">Use result as input</button>
        </div>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement"></div>
    </div>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail"></div></aside>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../contact.html">Contact</a>
      <p>&copy; 2026 Toolkit Lab</p>
    </div>
  </footer>

  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');

    function words(text) {
      return text
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
        .split(/[^A-Za-z0-9]+/)
        .filter(Boolean);
    }

    function capitalize(word) {
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }

    const converters = {
      upper: text => text.toUpperCase(),
      lower: text => text.toLowerCase(),
      title: text => text.toLowerCase().replace(/\b\p{L}/gu, ch => ch.toUpperCase()),
      sentence: text => text.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu, (m, sep, ch) => sep + ch.toUpperCase()),
      camel: text => words(text).map((w, i) => i === 0 ? w.toLowerCase() : capitalize(w)).join(''),
      pascal: text => words(text).map(capitalize).join(''),
      snake: text => words(text).map(w => w.toLowerCase()).join('_'),
      kebab: text => words(text).map(w => w.toLowerCase()).join('-')
    };

    document.querySelectorAll('[data-case]').forEach(btn => {
      btn.addEventListener('click', () => {
        outputEl.value = converters[btn.dataset.case](inputEl.value);
      });
    });

    document.getElementById('copy').addEventListener('click', async () => {
      if (!outputEl.value) return;
      try {
        await navigator.clipboard.writeText(outputEl.value);
      } catch (err) {
        outputEl.select();
        document.execCommand('copy');
      }
    });

    document.getElementById('useResult').addEventListener('click', () => {
      inputEl.value = outputEl.value;
      outputEl.value = '';
    });
  </script>
</body>
</html>
