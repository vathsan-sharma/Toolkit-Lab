<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <title>QR Code Generator - Toolkit Lab</title>
  <meta name="description" content="Create a QR code from a link or text, then download it as a PNG. Generated in your browser.">
  <link rel="canonical" href="https://toolkitlab.xyz/tools/qr-code-generator.html">
  <meta property="og:site_name" content="Toolkit Lab">
  <meta property="og:url" content="https://toolkitlab.xyz/tools/qr-code-generator.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../assets/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qr-creator@1.0.0/dist/qr-creator.min.js" defer></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">T</span>Toolkit Lab</a>
      <nav class="site">
        <a href="../index.html#tools">Tools</a>
        <a href="../guides/index.html">Guides</a>
        <a href="../about.html">About</a>
        <div class="nav-tools">
          <button class="search-trigger" data-open-palette type="button" aria-label="Open search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>Search</span><kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle theme"></button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail">Ad space</div></aside>
    <div class="wrap">
      <div class="tool-head">
        <p class="crumbs"><a href="../index.html">Tools</a> / QR Code Generator</p>
        <h1>QR Code Generator</h1>
        <p class="lead">Type a link or some text and get a QR code you can download. Nothing is sent to a server.</p>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement">Ad space</div>

      <div class="panel">
        <label for="text">Link or text</label>
        <textarea id="text" rows="3" style="min-height:0" placeholder="https://example.com">https://example.com</textarea>

        <label for="size">Size: <span id="sizeValue">256</span> px</label>
        <input type="range" id="size" min="128" max="512" step="16" value="256" style="width:100%">

        <label for="ec">Error correction</label>
        <select id="ec">
          <option value="L">Low (smallest code)</option>
          <option value="M" selected>Medium</option>
          <option value="Q">Quartile</option>
          <option value="H">High (best if a logo may cover it)</option>
        </select>

        <div class="row">
          <button id="download" class="secondary" type="button">Download PNG</button>
        </div>

        <p id="error" class="error" hidden></p>
        <div class="preview" style="text-align:center;margin-top:20px">
          <canvas id="canvas" width="256" height="256" style="max-width:100%;height:auto;border-radius:8px;background:#fff"></canvas>
        </div>
      </div>

      <!-- AdSense: place your ad unit code here once your site is approved. -->
      <div class="ad-slot" aria-label="Advertisement">Ad space</div>
    </div>
    <aside class="ad-rail" aria-label="Advertisement"><div class="ad-slot ad-slot-rail">Ad space</div></aside>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="../about.html">About</a>
      <a href="../privacy.html">Privacy Policy</a>
      <a href="../contact.html">Contact</a>
      <p>&copy; 2026 Toolkit Lab</p>
    </div>
  </footer>

  <script>
    const textEl = document.getElementById('text');
    const sizeEl = document.getElementById('size');
    const ecEl = document.getElementById('ec');
    const canvas = document.getElementById('canvas');
    const errorEl = document.getElementById('error');

    function draw() {
      const text = textEl.value.trim();
      const size = Number(sizeEl.value);
      document.getElementById('sizeValue').textContent = size;
      canvas.width = size;
      canvas.height = size;
      if (!text) {
        errorEl.textContent = 'Enter a link or some text first.';
        errorEl.hidden = false;
        return;
      }
      if (!window.QrCreator) {
        errorEl.textContent = 'The QR library could not load. Check your internet connection and try again.';
        errorEl.hidden = false;
        return;
      }
      try {
        window.QrCreator.render({
          text: text,
          radius: 0,
          ecLevel: ecEl.value,
          fill: '#1c1917',
          background: '#ffffff',
          size: size
        }, canvas);
        errorEl.hidden = true;
      } catch (err) {
        errorEl.textContent = 'This text is too long for a QR code. Try a shorter link or lower the error correction.';
        errorEl.hidden = false;
      }
    }

    sizeEl.addEventListener('input', draw);
    textEl.addEventListener('input', draw);
    ecEl.addEventListener('change', draw);

    document.getElementById('download').addEventListener('click', () => {
      if (!textEl.value.trim() || errorEl.hidden === false) return;
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = 'qr-code.png';
      link.click();
    });

    // The library loads after the page, so draw once it is ready.
    window.addEventListener('load', draw);
  </script>
</body>
</html>
